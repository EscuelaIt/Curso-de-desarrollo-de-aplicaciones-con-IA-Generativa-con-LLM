services:
  api:
    build: ../api
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../data:/app/data
      - ../docs-piloto:/app/docs-piloto:ro
    environment:
      DATA_DIR: /app/data
      DOCS_SEED_DIR: /app/docs-piloto
    networks: [app]

  web:
    build:
      context: ../web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    networks: [app]
    depends_on: [api]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on: [api, web]
    networks: [app]

networks:
  app:
